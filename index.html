    <style>
      /* Shown before any script loads. Opacity and transform animations run
         off the main thread, so it keeps moving while the tank is built. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #0c1512;
        transition:
          opacity 0.6s ease,
          visibility 0s 0.6s;
      }
      #splash.hidden {
        opacity: 0;
        visibility: hidden;
      }
      .splash-tank {
        position: relative;
        width: 76px;
        height: 78px;
      }
      .splash-tank img {
        width: 100%;
        height: 100%;
        animation: splash-breathe 2.6s ease-in-out infinite;
        will-change: opacity;
      }
      .splash-tank span {
        position: absolute;
        bottom: 18px;
        width: 5px;
        height: 5px;
        border: 1.5px solid #e7eadf;
        border-radius: 50%;
        opacity: 0;
        animation: splash-rise 2.6s ease-in infinite;
        will-change: transform, opacity;
      }
      .splash-tank span:nth-child(2) {
        left: 30%;
      }
      .splash-tank span:nth-child(3) {
        left: 52%;
        animation-delay: 0.9s;
      }
      .splash-tank span:nth-child(4) {
        left: 68%;
        animation-delay: 1.7s;
      }
      @keyframes splash-breathe {
        50% {
          opacity: 0.6;
        }
      }
      @keyframes splash-rise {
        0% {
          transform: translateY(0) scale(0.6);
          opacity: 0;
        }
        25% {
          opacity: 0.7;
        }
        100% {
          transform: translateY(-46px) scale(1);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-tank img,
        .splash-tank span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading">
