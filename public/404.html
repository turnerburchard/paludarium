<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172721" />
    <meta name="robots" content="noindex" />
    <!-- Served for any missing path, so every link here is absolute. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Not found · paludarium</title>
    <style>
      @font-face {
        font-family: "Newsreader";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        size-adjust: 112%;
        src: url("/fonts/newsreader-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Figtree";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/figtree-latin.woff2") format("woff2");
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0c1512;
        color: #e7eadf;
        font:
          400 15px/1.5 "Figtree",
          ui-sans-serif,
          system-ui,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      h1 {
        margin: 20px 0 8px;
        font:
          500 28px/1.25 "Newsreader",
          Georgia,
          serif;
      }
      p {
        margin: 0 0 28px;
        color: #b9c7b0;
      }
      a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 999px;
        background: #aec5a0;
        color: #14241b;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        background: #c3d6b6;
      }
      a:focus-visible {
        outline: 2px solid #e7eadf;
        outline-offset: 3px;
      }
      .mark {
        display: block;
        width: 64px;
        height: 66px;
        margin: 0 auto;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/paludarium-mark-light.svg" alt="" />
      <h1>Page not found</h1>
      <p>It may have moved, or the link may be mistyped.</p>
      <a href="/">Back to your tank</a>
    </main>
  </body>
</html>
